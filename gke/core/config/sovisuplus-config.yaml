apiVersion: v1
kind: ConfigMap
metadata:
  name: sovisuplus-config
  labels:
    app: sovisuplus
data:
  APP_URL: '${SOVISUPLUS_HOST}'
  APP_ENV: '${APP_ENV}'
  INSTITUTION_NAME: '${INSTITUTION_NAME}'
  KEYCLOAK_CLIENT_ID: '${KEYCLOAK_CLIENT_ID}'
  KEYCLOAK_ADDR: '${KEYCLOAK_ADDR}'
  KEYCLOAK_REALM: '${KEYCLOAK_REALM}'
  GRAPHQL_ENDPOINT_ENABLED: 'true'
  GRAPHQL_ENDPOINT_URL: 'http://apollo:4000'
  GRAPHQL_API_KEY_ENABLED: 'true'



