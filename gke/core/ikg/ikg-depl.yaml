apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ikg
  name: ikg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ikg
  strategy: { }
  template:
    metadata:
      labels:
        app: ikg
    spec:
      serviceAccountName: k8s-service-account
      containers:
        - name: ikg
          args:
            - bash
            - -c
            - while ! nc -z ${NEO4J_INSTANCE_NAME} ${NEO4J_PORT}; do echo "waiting for database" && sleep 1; done; uvicorn app.main:app --host 0.0.0.0 --port 8000
          env:
            - name: AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crisalid-bus-secret
                  key: amqp_password
            - name: AMQP_USER
              valueFrom:
                secretKeyRef:
                  name: crisalid-bus-secret
                  key: amqp_user
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ikg-neo4j-secret
                  key: neo4j_password
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: ikg-neo4j-secret
                  key: neo4j_user
            - name: DOCKER_DIGEST
              value: ${IKG_DOCKER_IMAGE_DIGEST}
          envFrom:
            - configMapRef:
                name: ikg-config
          image: ${IKG_DOCKER_IMAGE_NAME}:${IKG_DOCKER_IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 10000m
              memory: 3Gi
            requests:
              cpu: 5000m
              memory: 1Gi
      restartPolicy: Always