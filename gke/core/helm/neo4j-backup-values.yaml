neo4j:
  image: "neo4j/helm-charts-backup"
  imageTag: "5.10.0"
  jobSchedule: "30 20 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  backoffLimit: 3

serviceAccountName: "k8s-service-account"

backup:
  bucketName: "${NEO4J_BACKUP_BUCKET_NAME}"
  databaseAdminServiceName: "neo4j-backup"
  databaseNamespace: "${INST}"
  database: "neo4j,system"
  cloudProvider: "gcp"
consistencyCheck:
  enabled: true