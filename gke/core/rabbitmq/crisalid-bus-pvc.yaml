---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: crisalid-bus-pvc-data
  labels:
    app: crisalid-bus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: crisalid-bus-pvc-logs
  labels:
    app: crisalid-bus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
