apiVersion: v1
kind: Service
metadata:
  name: crisalid-bus-external-access
  namespace: yourinst
spec:
  type: LoadBalancer
  selector:
    app: crisalid-bus
  ports:
    - name: amqp
      protocol: TCP
      port: 5672
      targetPort: 5672
    - name: management
      protocol: TCP
      port: 15672
      targetPort: 15672